      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#B9FFF0" stop-opacity="0.85"/>
    </linearGradient>
    <g id="aurora">
      <path d="M-160,640 C100,420 300,720 540,500 S860,300 1180,400" fill="none" stroke="url(#gTeal)" stroke-width="170" filter="url(#b34)"/>
      <path d="M-160,560 C100,340 300,640 540,420 S860,220 1180,320" fill="none" stroke="url(#gTeal)" stroke-width="300" filter="url(#b90)" opacity="0.6"/>
