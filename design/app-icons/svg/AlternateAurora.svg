    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02041A"/>
      <stop offset="0.6" stop-color="#061334"/>
      <stop offset="1" stop-color="#0A2748"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
