  <!-- altın: gold foil serif $ on burgundy with a guilloche rosette (Abril Fatface, OFL) -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#7A1A35"/>
      <stop offset="0.6" stop-color="#4A0E21"/>
      <stop offset="1" stop-color="#2A0712"/>
